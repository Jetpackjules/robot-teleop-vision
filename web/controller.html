<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Teleop Vision</title>
  <link rel="icon" type="image/png" href="/assets/branding/robot_teleop_vision_icon.png">
  <script>
    window.robotTeleopPageId = (
      window.crypto && typeof window.crypto.randomUUID === "function"
        ? window.crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(16).slice(2)}`
    ).replace(/[^A-Za-z0-9_-]/g, "");
  </script>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(14, 16, 18, 0.88);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f5f7fb;
      --muted: #b7c0cb;
      --ok: #53e391;
      --warn: #ffd166;
      --bad: #ff6b6b;
      --accent: #8fd3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #050607;
      color: var(--text);
      font: 15px/1.4 system-ui, sans-serif;
    }
    #viewport-video,
    #viewport-image,
    #hybrid-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #050607;
      cursor: crosshair;
    }
    #viewport-video[hidden],
    #viewport-image[hidden],
    #hybrid-canvas[hidden],
    [hidden] { display: none !important; }
    .topbar {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }
    .control-stack {
      width: min(360px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      display: grid;
      gap: 8px;
      overflow-y: auto;
      scrollbar-gutter: stable;
      pointer-events: auto;
    }
    .status-chip,
    details.settings {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }
    .status-chip {
      min-width: min(360px, calc(100vw - 32px));
      padding: 10px 12px;
      border-radius: 8px;
      font: 13px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .status-main {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font: 700 13px/1.2 system-ui, sans-serif;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: 0 0 auto; }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--bad); }
    .status-lines { color: var(--muted); white-space: pre-wrap; }
    .head-height-control { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); }
    .keyboard-guide {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .keyboard-guide strong { color: var(--text); }
    kbd {
      display: inline-block;
      min-width: 42px;
      margin-right: 5px;
      padding: 1px 5px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text);
      text-align: center;
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .network-stats {
      padding: 10px 12px;
      border: 1px solid #343434;
      background: #151515;
      color: #d8d8d8;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: pre-line;
    }
    .latency-panel {
      padding: 9px 10px 7px;
      border: 1px solid #343434;
      background: #101010;
      color: #d8d8d8;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .latency-panel-header { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
    #rgbd-latency-graph { display: block; width: 100%; height: 96px; }
    details.settings {
      width: min(360px, calc(100vw - 32px));
      border-radius: 8px;
      overflow: hidden;
    }
    summary { cursor: pointer; list-style: none; padding: 11px 13px; font-weight: 700; }
    summary::-webkit-details-marker { display: none; }
    .settings-body { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 10px; }
    label { display: grid; gap: 5px; color: var(--muted); font-size: 13px; }
    select,
    input[type="range"],
    button,
    a.button {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font: inherit;
    }
    select { padding: 0 10px; background: #171a1e; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .toggle-row { grid-template-columns: 1fr auto; align-items: center; }
    .value-label { color: var(--text); font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; }
    button,
    a.button { display: grid; place-items: center; text-decoration: none; cursor: pointer; }
    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .primary { background: rgba(143, 211, 255, 0.18); border-color: rgba(143, 211, 255, 0.42); }
    .hold { background: rgba(255, 107, 107, 0.2); border-color: rgba(255, 107, 107, 0.7); color: #fff; font-weight: 800; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    .calibration-progress {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .calibration-progress progress { width: 100%; height: 12px; accent-color: var(--accent); }
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.55);
    }
    .start-card {
      width: min(360px, 100%);
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42);
    }
    .start-card h1 { margin: 0 0 12px; font-size: 20px; }
    .start-card p { margin: 0 0 16px; color: var(--muted); }
    #video-preview { display: none; }
    @media (max-width: 760px) {
      .topbar { flex-direction: column; }
      .status-chip,
      details.settings,
      .control-stack { width: 100%; }
    }
  </style>
  <script type="module" src="./godot_webcam_tracker_bridge.js?v=20260802_module_api_v1"></script>
  <script type="module" src="./hybrid_rgbd_renderer.js?v=20260802_module_api_v1"></script>
</head>
<body>
  <video id="viewport-video" muted autoplay playsinline></video>
  <img id="viewport-image" alt="" hidden>
  <canvas id="hybrid-canvas" hidden></canvas>

  <div class="topbar">
    <div class="control-stack">
      <details class="settings">
        <summary>Settings</summary>
        <div class="settings-body">
          <label>Stream
            <select id="stream-preset">
              <option value="quality" selected>Quality point cloud</option>
              <option value="latency">Low latency point cloud</option>
            </select>
          </label>
          <label class="toggle-row"><span>Persistent still-scene compression</span><input id="persistent-temporal-reference-enabled" type="checkbox" checked></label>
          <label class="toggle-row"><span>Full RGB frame updates</span><input id="full-rgb-frame-updates-enabled" type="checkbox"></label>
          <div class="button-row">
            <button id="recenter" class="primary" type="button">Recenter</button>
            <button id="restart" type="button">Restart</button>
          </div>
          <div id="robot-settings-root"></div>
          <div id="network-stats" class="network-stats">Network stats unavailable</div>
          <div class="latency-panel">
            <div class="latency-panel-header"><span>RGB-D capture latency · 120s</span><span id="rgbd-latency-value">—</span></div>
            <canvas id="rgbd-latency-graph" width="336" height="96" aria-label="RGB-D latency over the last 120 seconds"></canvas>
          </div>
          <a class="button" href="./webcam_tracker_test.html">Advanced</a>
          <a id="transport-link" class="button" href="/frame-stream">Frame Stream Fallback</a>
        </div>
      </details>

      <details class="settings" id="view-settings">
        <summary>View</summary>
        <div class="settings-body">
          <label class="toggle-row"><span>Inspect orbit</span><input id="inspect-enabled" type="checkbox" checked></label>
          <label>Orbit span <span id="orbit-span-value" class="value-label">160 deg</span><input id="orbit-span" type="range" min="30" max="360" step="5" value="160"></label>
          <label>Orbit response <span id="orbit-response-value" class="value-label">2.5</span><input id="orbit-response" type="range" min="0.4" max="6" step="0.1" value="2.5"></label>
          <label>View distance <span id="orbit-distance-value" class="value-label">0.35 m</span><input id="orbit-distance" type="range" min="0.25" max="2.5" step="0.05" value="0.35"></label>
          <label class="toggle-row"><span>Head Z zoom</span><input id="dolly-enabled" type="checkbox" checked></label>
          <label>Zoom strength <span id="dolly-gain-value" class="value-label">0.008 m/cm</span><input id="dolly-gain" type="range" min="0" max="0.04" step="0.001" value="0.008"></label>
          <label>Field of view <span id="inspect-fov-value" class="value-label">55 deg</span><input id="inspect-fov" type="range" min="30" max="100" step="1" value="55"></label>
          <label class="toggle-row"><span>White background</span><input id="white-background-enabled" type="checkbox"></label>
          <div id="robot-view-root"></div>
          <button id="inspect-recenter" type="button">Recenter Inspect View</button>
        </div>
      </details>
    </div>

    <div class="status-chip">
      <div class="status-main"><span id="status-dot" class="dot"></span><span id="status-title">Starting</span></div>
      <div id="status-lines" class="status-lines">Preparing controller</div>
      <label class="head-height-control">View height above scene origin <span id="head-height-value" class="value-label">0.35 m</span><input id="head-height" type="range" min="0" max="1" step="0.01" value="0.35"></label>
      <label class="head-height-control">View elevation <span id="orbit-elevation-value" class="value-label">0 deg</span><input id="orbit-elevation" type="range" min="-60" max="60" step="1" value="0"></label>
      <div id="robot-status-root"></div>
    </div>
  </div>

  <div id="robot-floating-root"></div>

  <div id="start-overlay" hidden>
    <div class="start-card">
      <h1>Start Controller</h1>
      <p id="start-message">Camera permission needs a tap.</p>
      <button id="start-button" class="primary" type="button">Start</button>
    </div>
  </div>
  <div id="video-preview"></div>

  <script type="module" src="./controller_hybrid.js?v=20260802_module_api_v1"></script>
</body>
</html>
