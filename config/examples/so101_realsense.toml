[stack]
host = "0.0.0.0"
https_port = 8765
stream_port = 8780
tracking_port = 4247
calibration_status_port = 4251
# "quick" creates a free, temporary trycloudflare.com URL. The init command
# replaces the password sentinel below with a strong local password.
public_mode = "quick"
password_env = "GODOT_REMOTE_PASSWORD"
password_default = "change-me"

[godot]
# Leave blank to auto-detect Godot 4.6+ from PATH or ~/Downloads.
executable = ""
project = "."
launch_runtime = true
# Set true only when executable points to an exported Robot Teleop Vision app.
packaged_runtime = false

[cameras]
# Every connected RealSense is discovered dynamically by serial at runtime.
adapters = ["realsense"]

[robot]
# Start with hardware disabled. After calibrating your own arm, copy its local
# profile to robot_modules/so101/local/arm_pair.json and enable motion.
adapter = "so101"
enabled = false

[robot.options]
profile = "robot_modules/so101/local/arm_pair.json"
python = ""
dry_run = false
hold_on_connect = true
ignore_motor_6 = false
# Optional V4L2 path. Blank auto-discovers the example arm's wrist camera.
wrist_camera_device = ""
